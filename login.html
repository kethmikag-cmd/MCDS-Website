<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinator Login — Ninnada'26 | MCDS</title>
    <meta name="description"
        content="Coordinator Login portal for Ninnada'26 — the largest all-island trillingual media competition in Sri Lanka, organized by the Media Circle of D.S.Senanayake College.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&family=Montserrat:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK importmap -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
        }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false,
                container: false,
            }
        }
    </script>
    <style>
        .reg-page {
            min-height: 100vh;
            min-height: 100svh;
            background: linear-gradient(180deg, #000000 0%, #020713 40%, #081125 80%, #000000 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .glass-form {
            background: rgba(5, 5, 10, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(218, 165, 32, 0.2);
            box-shadow:
                0 0 40px rgba(218, 165, 32, 0.06),
                0 0 80px rgba(218, 165, 32, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            border-radius: 24px;
        }

        .reg-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(218, 165, 32, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Lato', sans-serif;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            min-height: 50px;
        }

        .reg-input::placeholder {
            color: rgba(180, 180, 180, 0.4);
        }

        .reg-input:focus {
            border-color: rgba(218, 165, 32, 0.7);
            box-shadow: 0 0 0 3px rgba(218, 165, 32, 0.12), 0 0 15px rgba(218, 165, 32, 0.15);
            background: rgba(0, 0, 0, 0.7);
        }

        .reg-label {
            display: block;
            color: rgba(218, 165, 32, 0.85);
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .reg-submit-btn {
            width: 100%;
            padding: 16px;
            background-color: #ffff00;
            color: #3e2723;
            font-weight: 900;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: clamp(1px, 0.5vw, 3px);
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.5), 0 0 40px rgba(255, 255, 0, 0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 8px;
            min-height: 52px;
        }

        .reg-submit-btn:hover {
            transform: scale(1.03);
            background-color: #ffff33;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.9), 0 0 60px rgba(255, 255, 0, 0.3);
        }

        .reg-submit-btn:active {
            transform: scale(0.98);
        }

        .back-link {
            color: rgba(218, 165, 32, 0.6);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            padding: 8px 0;
        }

        .back-link:hover {
            color: rgba(255, 255, 0, 0.9);
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        }

        .ninnada-orb {
            filter: blur(70px);
        }

        .orb-sm {
            filter: blur(50px);
        }

        .orb-lg {
            filter: blur(100px);
        }

        .orb-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
    </style>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
</head>

<body>
    <!-- Header -->
    <header>
        <div class="container header-container">
            <div class="header-left-group">
                <a href="ninnada.html" class="logo logo-ninnada">Ninnada'26</a>
                <div id="header-auth" class="header-auth-left"></div>
            </div>
            <nav>
                <ul class="nav-links">
                    <li class="nav-item"><a href="ninnada.html" class="nav-link">← Back to Ninnada</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Page -->
    <div class="reg-page flex-1">
        <!-- Animated Glowing Orbs Background -->
        <div class="orb-container">
            <div class="ninnada-orb orb-lg"
                style="width:min(600px,90vw);height:min(600px,90vw);top:-150px;left:-200px;"></div>
            <div class="ninnada-orb"
                style="width:min(420px,70vw);height:min(420px,70vw);top:30%;right:-120px;background:radial-gradient(circle, rgba(255,215,0,0.5) 0%, rgba(218,165,32,0.1) 50%, transparent 80%);">
            </div>
            <div class="ninnada-orb orb-lg" style="width:min(580px,90vw);height:min(580px,90vw);bottom:0;left:-150px;">
            </div>
            <div class="ninnada-orb"
                style="width:min(460px,75vw);height:min(460px,75vw);bottom:-80px;right:-140px;background:radial-gradient(circle, rgba(255,215,0,0.45) 0%, rgba(218,165,32,0.08) 50%, transparent 80%);">
            </div>
        </div>

        <!-- Form Section -->
        <main class="relative z-10 flex-1 flex items-center justify-center py-10 md:py-16 px-4">
            <div class="w-full max-w-md">
                <!-- Page Title -->
                <div class="text-center mb-8 md:mb-12">
                    <h1 style="font-size:clamp(1.8rem,7vw,3.0rem);"
                        class="font-black text-glow-yellow-lg tracking-widest uppercase mb-4 font-[Montserrat]">
                        Coordinator Login</h1>
                    <p class="text-gray-400 text-sm md:text-base font-[Lato] tracking-wide">
                        Sign in to manage your school's contestant entries
                    </p>
                    <div
                        class="mt-4 w-20 h-px mx-auto bg-gradient-to-r from-transparent via-yellow-500 to-transparent opacity-60">
                    </div>
                </div>

                <!-- Glass Form Card -->
                <div class="glass-form px-6 sm:px-8 py-8 md:py-10">
                    <form id="login-form" onsubmit="handleLogin(event)" novalidate>
                        <!-- Email -->
                        <div class="mb-6">
                            <label for="email" class="reg-label">Email Address</label>
                            <input type="email" id="email" name="email" class="reg-input" placeholder="your@email.com"
                                required autocomplete="email">
                        </div>

                        <!-- Password -->
                        <div class="mb-8">
                            <label for="password" class="reg-label">Password</label>
                            <div class="password-toggle-wrapper">
                                <input type="password" id="password" name="password" class="reg-input"
                                    placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="password-toggle-btn" aria-label="Show password"
                                    title="Show password" onclick="togglePasswordVisibility('password', this)">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                    <svg class="eye-slash-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20"
                                        height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 013.122-.442c4.478 0 8.268 2.943 9.542 7a9.97 9.97 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="submit-btn" class="reg-submit-btn">
                            Sign In
                        </button>

                        <!-- Status Message -->
                        <p id="form-status"
                            class="text-center mt-4 text-sm font-[Montserrat] font-bold tracking-wide hidden"></p>
                    </form>
                </div>

                <!-- Secondary Actions -->
                <div class="text-center mt-8 flex flex-col gap-2">
                    <a href="registration.html" class="back-link">
                        Don't have an account? Register School
                    </a>
                    <a href="ninnada.html" class="back-link">
                        ← Return to Ninnada'26
                    </a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="relative z-10">
            <div class="container text-center">
                <p>&copy; 2026 Media Circle of D. S. Senanayake College. All Rights Reserved.</p>
                <p class="footer-credit">Developed by: Aditha Geeganage & Senath Sethmika</p>
            </div>
        </footer>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from 'firebase/auth';

        window.handleLogin = async function (e) {
            e.preventDefault();

            const emailField = document.getElementById('email');
            const passwordField = document.getElementById('password');
            const status = document.getElementById('form-status');
            const btn = document.getElementById('submit-btn');

            // Reset field styles
            emailField.style.borderColor = '';
            emailField.style.boxShadow = '';
            passwordField.style.borderColor = '';
            passwordField.style.boxShadow = '';

            const email = emailField.value.trim();
            const password = passwordField.value;

            if (!email || !password) {
                if (!email) {
                    emailField.style.borderColor = 'rgba(255,80,80,0.7)';
                    emailField.style.boxShadow = '0 0 0 3px rgba(255,80,80,0.1)';
                }
                if (!password) {
                    passwordField.style.borderColor = 'rgba(255,80,80,0.7)';
                    passwordField.style.boxShadow = '0 0 0 3px rgba(255,80,80,0.1)';
                }
                status.textContent = 'Please fill in all fields.';
                status.className = 'text-center mt-4 text-sm font-[Montserrat] font-bold tracking-wide text-red-400';
                status.classList.remove('hidden');
                return;
            }

            // Loading state
            btn.textContent = 'Signing in…';
            btn.disabled = true;
            btn.style.opacity = '0.7';
            status.textContent = '';
            status.classList.add('hidden');

            try {
                console.log('[Login] Setting local persistence...');
                await setPersistence(auth, browserLocalPersistence);

                console.log('[Login] Signing in:', email);
                await signInWithEmailAndPassword(auth, email, password);
                console.log('[Login] Sign-in successful. Redirecting to dashboard...');

                // Clear any stale cached school info so dashboard re-fetches fresh data
                sessionStorage.removeItem('cached_school_name');
                sessionStorage.removeItem('cached_coordinator_name');

                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error('[Login] Firebase Auth error:', err);
                btn.textContent = 'Sign In';
                btn.disabled = false;
                btn.style.opacity = '1';

                let errorMsg = 'Invalid email or password. Please try again.';
                if (err.code === 'auth/invalid-email') errorMsg = 'Invalid email address format.';
                else if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') errorMsg = 'Invalid email or password.';
                else if (err.code === 'auth/user-disabled') errorMsg = 'This account has been disabled.';
                else if (err.code === 'auth/too-many-requests') errorMsg = 'Too many login attempts. Please try again later.';

                status.textContent = errorMsg;
                status.className = 'text-center mt-4 text-sm font-[Montserrat] font-bold tracking-wide text-red-400';
                status.classList.remove('hidden');
            }
        };
    </script>
    <script type="module" src="auth-handler.js"></script>
    <script src="password-toggle.js"></script>
</body>

</html>
